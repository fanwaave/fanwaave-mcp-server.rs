name: Resolve patched Cargo lock
on:
  pull_request:
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
      - name: Resolve compatible security patches
        run: |
          cargo update -p quinn-proto --precise 0.11.18
          cargo update -p rustls --precise 0.23.46
          cargo metadata --locked --format-version 1 >/dev/null
          printf '\nCARGO_LOCK_BEGIN\n'
          cat Cargo.lock
          printf '\nCARGO_LOCK_END\n'
