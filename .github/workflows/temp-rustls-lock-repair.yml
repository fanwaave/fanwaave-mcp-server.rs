name: Temporary rustls lock repair
on:
  push:
    branches:
      - formal/multi-method-wave6-20260925
    paths:
      - .github/workflows/temp-rustls-lock-repair.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: formal/multi-method-wave6-20260925
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
      - name: Resolve patched rustls graph
        run: |
          set -euo pipefail
          cargo update -p rustls --precise 0.23.45
          cargo check --locked --all-targets
          grep -A3 '^name = "rustls"$' Cargo.lock | grep 'version = "0.23.45"'
      - name: Commit lockfile-only repair
        run: |
          set -euo pipefail
          extra="$(git status --porcelain | grep -v '^ M Cargo.lock$' || true)"
          test -z "$extra"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: resolve rustls RUSTSEC-2026-0285'
          git push origin HEAD:formal/multi-method-wave6-20260925
